[package]
name = "rclone-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.3"
configparser = "3.0"
futures = "0.3"
lazy_static = "1.4"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
argon2 = { version = "0.5.3", features = ["std"] }
# Session tokens: SHA-256 over a 32-byte random token (see src/handlers/auth.rs)
# and a constant-time comparison for the resulting digest. Both crates are
# already in the tree as transitive dependencies of argon2/password-hash and
# declare no `rust-version`, so they do not move the MSRV (builder: rust 1.88).
sha2 = "0.10"
subtle = "2.6"
# TLS für den Downloader („Von URL holen"). Bewusst `tokio-rustls` statt eines
# vollständigen HTTP-Clients: der Transport in `src/handlers/urlguard.rs`
# bekommt die *geprüfte* Socket-Adresse aus `vet_url` und verbindet selbst —
# ein Client mit eigener Namensauflösung (oder eigener Redirect-Verfolgung)
# würde den Rebinding-Schutz aushängen. `tokio-rustls` sieht nur den fertigen
# `TcpStream` und kann deshalb nicht auflösen.
#
# Kosten: **eine** neue Kiste. `rustls` (0.23.32, ring), `rustls-pki-types`,
# `ring` und `webpki-roots` liegen über `sqlx/runtime-tokio-rustls` längst im
# Baum. `reqwest 0.12` wären 20 zusätzliche Kisten gewesen (inkl. quinn und
# einer zweiten `tower-http`-Version).
#
# MSRV: tokio-rustls 0.26.4 = 1.71, rustls 0.23.32 = 1.71, ring = 1.66,
# webpki-roots = keine Angabe. Builder im Dockerfile: rust 1.88.
#
# `default-features = false` ist Absicht: die Standardauswahl zieht
# `aws-lc-rs` herein (C-Toolchain im Builder) und würde neben dem bereits
# aktiven `ring` zu zwei Krypto-Anbietern führen. Der Anbieter wird zusätzlich
# ausdrücklich übergeben (`builder_with_provider`), damit nichts an einer
# prozessweiten Vorbelegung hängt.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
