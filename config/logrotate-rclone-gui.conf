# logrotate-Vorlage für das Laufverzeichnis des rsync-Daemons (Ticket 0cedda6f).
#
# Diese Datei wird NICHT von der Anwendung gelesen. Sie ist das Gegenstück zu
# der Warnung, die src/handlers/rsyncd.rs (RunDirWatch) ausgibt, wenn eine der
# Dateien im Laufverzeichnis über ihre Grenze wächst:
#
#     the rsync audit log has passed its size limit and is NOT rotated by this
#     process — ... Rotate from outside (config/logrotate-rclone-gui.conf) ...
#
# Installation auf dem Host bzw. in einem Image mit logrotate:
#
#     cp config/logrotate-rclone-gui.conf /etc/logrotate.d/rclone-gui
#     # Pfad anpassen: <RUN_DIR> ist $RSYNCD_DIR (siehe start.sh),
#     # im Container /app/data/rsyncd.
#     logrotate -d /etc/logrotate.d/rclone-gui   # Trockenlauf
#
# ---------------------------------------------------------------------------
# Warum die Anwendung das nicht selbst tut
# ---------------------------------------------------------------------------
#
# Ein Prozess, der sein eigenes Audit-Log kürzen kann, kann auch Beweise
# entfernen. Deshalb löscht und rotiert die Anwendung nichts in ihrem
# Laufverzeichnis — sie misst nur und meldet. Die Verantwortung für die
# Rotation liegt sichtbar hier, beim Betrieb.
#
# Warum es trotzdem jemand tun muss: im Laufverzeichnis liegen neben den Logs
# auch rsyncd.pid und rsyncd.lock. Eine volle Platte legt damit nicht nur das
# Log, sondern den gesamten rsync-Transport lahm ("failed to lock pid file"),
# und der Fehler sieht nach einem Daemon-Problem aus.
#
# Das Image bringt selbst KEIN logrotate mit. Ohne einen der folgenden Wege
# wächst das Verzeichnis unbegrenzt weiter:
#   * logrotate auf dem Host, auf das gemountete Verzeichnis
#   * ein eigenes Volume mit Quota für <RUN_DIR>
#   * regelmässiges Wegsichern und Neuanlegen der Dateien von aussen
#
# ---------------------------------------------------------------------------
# Audit-Log: Umbenennen ist sicher, copytruncate ist unnötig
# ---------------------------------------------------------------------------
#
# AuditSink::record() öffnet audit.log für JEDE Zeile neu (O_APPEND, Modus
# 0600) und schliesst es wieder. Ein Rotationslauf, der die Datei umbenennt und
# eine neue anlegt, verliert deshalb keine Zeile und braucht kein Signal an die
# Anwendung. `create 0600` ist Pflicht: die Datei enthält Modul-, Benutzer- und
# Peer-Adressen.
#
# `compress` ist bewusst gesetzt, `delaycompress` nicht nötig (siehe oben:
# niemand hält die Datei offen).
#
# WICHTIG: `rotate` gross genug wählen. Ein Audit-Log, das nach zwei Wochen
# verschwindet, beantwortet die Frage nicht mehr, für die es geführt wird.

<RUN_DIR>/audit.log {
    weekly
    rotate 52
    size 64M
    missingok
    notifempty
    compress
    create 0600 root root
}

# ---------------------------------------------------------------------------
# Daemon-Log: unkritisch
# ---------------------------------------------------------------------------
#
# rsyncd.log wird bei JEDEM Daemon-Start von der Anwendung geleert
# (write_truncated_log()), damit der Mirror nicht das Leben des Vorgängers
# nachspielt. Es wächst also nur innerhalb einer Daemon-Laufzeit — bei einem
# Container, der monatelang läuft, ist das trotzdem unbegrenzt.
#
# Hier ist `copytruncate` richtig: rsync hält die Datei offen und schreibt mit
# absolutem Offset weiter. Ein Umbenennen führte sonst dazu, dass der Daemon in
# die weggerollte Datei weiterschreibt und die neue leer bleibt.

<RUN_DIR>/rsyncd.log {
    daily
    rotate 7
    size 64M
    missingok
    notifempty
    compress
    copytruncate
    create 0600 root root
}

# ---------------------------------------------------------------------------
# stunnel-Log: rotieren, aber im Wissen, was dabei verloren geht
# ---------------------------------------------------------------------------
#
# Diese Datei ist ein Verbindungsprotokoll, kein Audit-Trail — trotzdem hängt
# das Audit-Log an ihr: die ECHTE Client-Adresse steht an keiner anderen Stelle
# (der Daemon sieht hinter der TLS-Terminierung nur 127.0.0.1, proxy protocol
# ist bewusst aus). StunnelIndex in src/handlers/rsyncd.rs liest die Datei
# fortlaufend ab einem Byte-Offset und verknüpft sie mit den Daemon-Sessions.
#
# Folgen für die Rotation:
#   * `copytruncate` ist Pflicht — stunnel hält die Datei offen.
#   * Zeilen, die zwischen zwei Lesevorgängen der Anwendung (alle 100 ms)
#     wegrotiert werden, gehen verloren. Betroffen sind genau die JÜNGSTEN
#     Verbindungen, also die, die gerade noch zugeordnet werden. Deren
#     Audit-Ereignisse tragen dann client_source=unavailable.
#   * Deshalb: selten rotieren und möglichst dann, wenn kein Transfer läuft.
#     Die Anwendung überschreitet die Grenze nicht heimlich — sie warnt.

<RUN_DIR>/stunnel.log {
    weekly
    rotate 8
    size 64M
    missingok
    notifempty
    compress
    copytruncate
    create 0600 root root
}

# ---------------------------------------------------------------------------
# Schwellen der Warnung
# ---------------------------------------------------------------------------
#
# Voreinstellung: 64 MiB je Datei, 256 MiB für das gesamte Laufverzeichnis,
# geprüft einmal pro Minute. Wiederholt wird eine Warnung nach 15 Minuten oder
# sobald sich die Datei seit der letzten Warnung verdoppelt hat.
#
# Anpassbar über die Umgebung (Bytes, 0 schaltet die Prüfung ab):
#
#     RCLONE_GUI_LOG_WARN_BYTES=67108864
#     RCLONE_GUI_RUN_DIR_WARN_BYTES=268435456
#
# Die Schwellen sollten UNTER dem liegen, was die Rotation oben stehen lässt —
# sonst warnt die Anwendung dauerhaft über einen Zustand, der so gewollt ist.
